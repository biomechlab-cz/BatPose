[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "batpose"
version = "0.1.0"
description = "Stereo FLIR Calibration + 3D Human Pose Estimation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "opencv-contrib-python>=4.8",
    "numpy>=1.26,<2.0",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "mediapipe>=0.10",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
rtmpose = [
    "rtmlib>=0.0.5",
    "onnxruntime>=1.16",
]
dev = [
    "ruff>=0.3",
    "pytest>=7.4",
    "pytest-qt>=4.4",
    "mypy>=1.5",
    "pytest-timeout>=2.1",
]

# ── FLIR camera support ──────────────────────────────────────────────────────
# The PySpin / spinnaker-python wheel is vendored under external/ because the
# Teledyne FLIR licence forbids redistribution via PyPI.  It is INTENTIONALLY
# not listed as a dependency above — `uv sync` would strip it.  Install with:
#     uv pip install external/spinnaker_python-4.3.0.190-cp310-cp310-win_amd64.whl
# Re-run that command after any `uv sync` or it will get removed again.
# The app degrades gracefully to the video-simulator source when PySpin is absent.

[project.scripts]
batpose-gui     = "app.gui.__main__:main"
batpose-calib   = "app.calib.__main__:main"
batpose-pose2d  = "app.pose2d.__main__:main"
batpose-recon3d = "app.recon3d.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
qt_api = "pyside6"
markers = [
    "manual: manual test requiring a human operator (deselect with -m 'not manual')",
]
